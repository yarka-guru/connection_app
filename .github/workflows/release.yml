name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install pango

      - name: Install frontend dependencies
        run: npm ci

      # The App Store Connect key is a file on disk as far as notarization is
      # concerned, but a secret as far as GitHub is concerned. Bridge the two.
      # macOS legs only — the Linux legs never notarize.
      - name: Prepare Apple API key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "ERROR: APPLE_API_KEY_P8 secret is empty — notarization would"
            echo "silently produce signed-but-unnotarized builds."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing. Ignored by the Linux legs.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: v__VERSION__
          releaseName: 'ConnectionApp v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }}

      # Tauri notarizes and staples the .app, then wraps it in a DMG that it
      # signs but never submits. Gatekeeper checks the DMG itself when a user
      # opens a downloaded one, and an unnotarized DMG is rejected with
      # "Apple cannot check it for malicious software" — even though the app
      # inside is fine. Verified on v3.7.8: the .app came back
      # "accepted / Notarized Developer ID" while the .dmg was
      # "rejected / Unnotarized Developer ID".
      - name: Notarize and staple the DMG
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          DMG_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"

          DMG=""
          for f in "$DMG_DIR"/*.dmg; do
            [ -f "$f" ] && DMG="$f" && break
          done
          if [ -z "$DMG" ]; then
            echo "ERROR: no .dmg found in $DMG_DIR"
            find "src-tauri/target/${{ matrix.rust_target }}/release/bundle" -type f | head -20
            exit 1
          fi
          echo "Notarizing: $DMG"

          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

          # Prove it before publishing. A stapled ticket that fails validation
          # is worse than none, because it looks done.
          xcrun stapler validate "$DMG"
          if ! spctl -a -vvv -t install "$DMG" 2>&1 | grep -q "source=Notarized Developer ID"; then
            echo "ERROR: dmg still not accepted as notarized after stapling"
            spctl -a -vvv -t install "$DMG" 2>&1
            exit 1
          fi

          gh release upload "v${VERSION}" "$DMG" --clobber --repo "${{ github.repository }}"

      - name: Build CLI binary
        shell: bash
        run: |
          cd src-tauri
          cargo build --release --no-default-features --bin connection-app-cli --target ${{ matrix.rust_target }}

      - name: Package and upload CLI binary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.rust_target }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BIN_DIR="src-tauri/target/${TARGET}/release"
          ARCHIVE="connection-app-cli-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${BIN_DIR}" connection-app-cli
          gh release upload "v${VERSION}" "${ARCHIVE}" --clobber --repo "${{ github.repository }}"

      - name: Sign updater artifact and save signature
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p sigs
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"

          # Find the updater artifact — must match what generate-update-json.js URLs point to:
          # macOS: .app.tar.gz, Linux: .AppImage
          UPDATER_FILE=""
          for f in "$BUNDLE"/macos/*.app.tar.gz "$BUNDLE"/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              UPDATER_FILE="$f"
              break
            fi
          done

          # Every target in the matrix produces an updater artifact. A missing one
          # means latest.json will advertise a URL that 404s with an empty signature,
          # so fail loudly rather than shipping a silently broken updater (v3.7.5:
          # "appimage" was absent from tauri.conf.json bundle targets and this
          # exited 0, so the job stayed green while Linux auto-update was dead).
          if [ -z "$UPDATER_FILE" ]; then
            echo "ERROR: No updater artifact found for ${{ matrix.rust_target }}"
            echo "Expected one of: *.app.tar.gz (macOS), *.AppImage (Linux)"
            echo "Bundle contents:"
            find "$BUNDLE" -type f 2>/dev/null | head -20
            exit 1
          fi

          echo "Signing: $UPDATER_FILE"
          npx tauri signer sign "$UPDATER_FILE" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

          # The signer creates a .sig file alongside the original
          SIG_FILE="${UPDATER_FILE}.sig"
          if [ -f "$SIG_FILE" ]; then
            cp "$SIG_FILE" "sigs/${{ matrix.rust_target }}.sig"
            echo "Signature saved ($(wc -c < "$SIG_FILE") bytes)"
            cat "$SIG_FILE"
          else
            echo "ERROR: .sig file not created at $SIG_FILE"
            exit 1
          fi

      - name: Upload signature artifact
        uses: actions/upload-artifact@v7
        with:
          name: sig-${{ matrix.rust_target }}
          path: sigs/
          if-no-files-found: ignore

  # Generate update manifest after builds complete (runs even if some fail)
  update-manifest:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all signature artifacts
        uses: actions/download-artifact@v8
        with:
          path: sigs
          pattern: sig-*
          merge-multiple: true

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Downloaded signatures ==="
          ls -la sigs/
          echo "=== Signature contents ==="
          for f in sigs/*.sig; do echo "--- $f ---"; cat "$f"; done
          node scripts/generate-update-json.js "$VERSION" "https://github.com/${REPO}/releases/download/v${VERSION}" sigs

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "=== latest.json content ==="
          cat latest.json
          gh release upload "v${VERSION}" latest.json --clobber
